<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Pocketbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky-free header, pill tabs, bento grid of rounded surfaces; numbers in mono tabular figures */
:root{
  --bg:#F3F5F9;--surface:#FFFFFF;--surface-2:#F6F8FC;--line:#E3E8F0;--fg:#0D1220;--muted:#586277;--faint:#8892A6;
  --accent:#3B5BFF;--accent-soft:#E8ECFF;--accent-fg:#FFFFFF;
  --in:#12936A;--in-soft:#DDF4EC;--out:#E04538;--out-soft:#FDE6E3;--warn:#B87800;--warn-soft:#FFF0CC;
  --shadow:0 1px 2px rgba(13,18,32,.05),0 14px 30px -18px rgba(13,18,32,.18);
  --glow:rgba(59,91,255,.10);--accent2:#10B5D6;--glow2:rgba(59,91,255,.18);--glow3:rgba(16,181,214,.10);
  --font:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090D17;--surface:#121827;--surface-2:#182033;--line:#243049;--fg:#E9EDF7;--muted:#98A4BC;--faint:#6B7791;
  --accent:#8196FF;--accent-soft:#1B2447;--accent-fg:#0A0E18;
  --in:#3DDBA0;--in-soft:#10322A;--out:#FF7B6E;--out-soft:#3A1C1B;--warn:#F5B63B;--warn-soft:#3A2C10;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 30px -18px rgba(0,0,0,.6);--glow:rgba(129,150,255,.14);--accent2:#5FD4F0;--glow2:rgba(129,150,255,.22);--glow3:rgba(95,212,240,.10);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#090D17;--surface:#121827;--surface-2:#182033;--line:#243049;--fg:#E9EDF7;--muted:#98A4BC;--faint:#6B7791;
  --accent:#8196FF;--accent-soft:#1B2447;--accent-fg:#0A0E18;
  --in:#3DDBA0;--in-soft:#10322A;--out:#FF7B6E;--out-soft:#3A1C1B;--warn:#F5B63B;--warn-soft:#3A2C10;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 30px -18px rgba(0,0,0,.6);--glow:rgba(129,150,255,.14);--accent2:#5FD4F0;--glow2:rgba(129,150,255,.22);--glow3:rgba(95,212,240,.10);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 460px at 6% -10%,var(--glow),transparent 70%),radial-gradient(760px 420px at 100% 0%,var(--glow3),transparent 70%);background-attachment:fixed}
.shell{max-width:1200px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:17px;letter-spacing:-.02em}
.mark{width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.grow{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:550;display:inline-flex;gap:8px;align-items:center;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-fg);border-color:transparent}
.btn.danger{color:var(--out)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:10px;box-shadow:none}
.btn.icon{padding:8px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs button{border:0;background:none;padding:7px 11px;border-radius:10px;color:var(--muted);font-weight:550;white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--accent-soft);color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:16px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;color:var(--muted);font-weight:500;font-size:13px}
.pill[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.mem{display:flex;gap:6px;align-items:center}
.mem .pill{display:inline-flex;gap:7px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--faint));flex:none;display:inline-block}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px;letter-spacing:.01em}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
@media(max-width:1000px){.s3{grid-column:span 6}.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
@media(max-width:560px){.s3{grid-column:span 12}.card{padding:15px;border-radius:20px}}
.kpi .lbl{color:var(--muted);font-weight:550;font-size:13px}
.kpi .val{font-size:27px;font-weight:550;margin:4px 0 6px;overflow-wrap:anywhere}
.kpi .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:34px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.chip.good{background:var(--in-soft);color:var(--in)}.chip.bad{background:var(--out-soft);color:var(--out)}.chip.warn{background:var(--warn-soft);color:var(--warn)}
.in{color:var(--in)}.out{color:var(--out)}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.banner{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--fg);border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin-bottom:14px}
.banner b{color:var(--accent)}
svg text{font-family:var(--font);fill:var(--muted);font-size:11px}
.b-in{fill:var(--in)}.b-out{fill:var(--out)}.grid-l{stroke:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;font-weight:500}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.split{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;align-items:center}
@media(max-width:560px){.split{grid-template-columns:1fr}}
.donut{position:relative;width:190px;height:190px;margin-inline:auto}
.donut .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut .ctr small{color:var(--muted);font-size:12px}.donut .ctr b{font-size:18px;font-weight:550}
.seg{cursor:pointer;transition:opacity .15s}
.rows{display:flex;flex-direction:column;gap:2px}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 8px;border-radius:10px;border:0;background:none;text-align:left;width:100%}
.lrow:hover,.lrow.hi{background:var(--surface-2)}
.lrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.lrow .pc{color:var(--faint);font-size:12px;width:38px;text-align:right}
.prog{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.prog>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
.ins{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.ins li{display:grid;grid-template-columns:10px 1fr;gap:10px;align-items:start}
.ins li:before{content:"";width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--c,var(--accent))}
.wk{display:flex;align-items:flex-end;gap:8px;height:110px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;font-size:11px;color:var(--faint)}
.wk i{display:block;width:100%;border-radius:7px 7px 3px 3px;background:var(--accent);opacity:.35;min-height:3px}
.wk div.mx i{opacity:1}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
.in-t{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;min-width:0}
.tools .in-t{flex:1 1 200px}
.tx{display:grid;grid-template-columns:96px minmax(0,1fr) 170px 120px;gap:12px;align-items:center;padding:10px 6px;border-top:1px solid var(--line)}
.tx.hd{border-top:0;color:var(--faint);font-size:12px;font-weight:600;padding-top:0}
.tx.hd button{border:0;background:none;font-weight:600;color:inherit;padding:0;text-align:left}
.tx .d{color:var(--muted);font-size:13px}
.tx .ds{min-width:0}.tx .ds b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .ds small{color:var(--faint)}
.tx .a{text-align:right;font-weight:500}
.csel{appearance:none;border:0;border-radius:999px;padding:4px 10px 4px 24px;font-size:12.5px;font-weight:550;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--fg);max-width:100%;
  background-image:radial-gradient(circle at 12px 50%,var(--c) 0 4px,transparent 4.5px)}
@media(max-width:700px){.tx{grid-template-columns:minmax(0,1fr) auto;row-gap:6px}.tx .d{grid-column:1}.tx .ds{grid-column:1}.tx .a{grid-column:2;grid-row:1/span 2}.tx .c{grid-column:1}.tx.hd{display:none}}
.empty{padding:32px 12px;text-align:center;color:var(--muted)}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--faint);font-weight:600;text-align:left;padding:0 10px 8px}
.tbl td{padding:10px;border-top:1px solid var(--line);vertical-align:middle}
.tbl .r{text-align:right}
.scroll{overflow-x:auto}
.hold{min-width:640px}
.bud{display:grid;grid-template-columns:minmax(120px,1.1fr) 120px minmax(120px,2fr) minmax(90px,.8fr);gap:14px;align-items:center;padding:11px 4px;border-top:1px solid var(--line)}
@media(max-width:700px){.bud{grid-template-columns:1fr 110px;row-gap:8px}.bud .prog{grid-column:1/-1}.bud .st{text-align:left}}
.bud input,.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.mini{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.mini .r{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px}
.mini .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(8,12,24,.55);backdrop-filter:blur(6px);display:grid;place-items:start center;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 40px}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5);width:min(680px,100%);margin-top:5vh;padding:22px;min-width:0}
.sheet h2{margin:0 0 4px;font-size:19px;letter-spacing:-.02em}
.sheet .sub{color:var(--muted);margin:0 0 16px}
.frm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.frm .full{grid-column:1/-1}
@media(max-width:520px){.frm{grid-template-columns:1fr}}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:9px 12px}
.drop{border:1.5px dashed var(--faint);border-radius:18px;padding:22px;text-align:center;color:var(--muted)}
#drop{position:fixed;inset:10px;z-index:60;border:2px dashed var(--accent);background:var(--accent-soft);border-radius:26px;display:grid;place-items:center;font-size:22px;font-weight:600;color:var(--accent);pointer-events:none}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--fg);color:var(--bg);padding:8px 11px;border-radius:11px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;transition:opacity .1s;max-width:240px}
#tip b{font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:550;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
.sec{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:22px 2px 10px}
.sec h2{margin:0;font-size:16px;letter-spacing:-.01em}

/* motion, theme switch, vibrance */
body,.card,.btn,.pill,.tabs,.sheet,.in-t,.csel,.theme,.banner,.lrow,.chip,.tag{transition:background-color .5s ease,color .5s ease,border-color .5s ease,box-shadow .5s ease}
.card{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,background-color .5s,border-color .5s}
.card:hover{transform:translateY(-3px);box-shadow:0 1px 2px rgba(13,18,32,.06),0 22px 40px -20px rgba(13,18,32,.28)}
.btn{transition:transform .2s cubic-bezier(.2,.8,.2,1),background-color .5s,border-color .2s,box-shadow .3s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.pill{transition:transform .2s,background-color .3s,color .3s,border-color .3s}.pill:hover{transform:translateY(-1px)}.pill:active{transform:scale(.95)}
.tabs button{transition:background-color .3s,color .3s}
@keyframes up{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
.grid>.card,.cards>.card,#txrows,.card.empty{animation:up .6s cubic-bezier(.2,.8,.2,1) backwards}
.grid>.card:nth-child(2){animation-delay:.05s}.grid>.card:nth-child(3){animation-delay:.1s}.grid>.card:nth-child(4){animation-delay:.15s}.grid>.card:nth-child(5){animation-delay:.2s}
.grid>.card:nth-child(6){animation-delay:.25s}.grid>.card:nth-child(7){animation-delay:.3s}.grid>.card:nth-child(n+8){animation-delay:.35s}
.cards>.card:nth-child(2){animation-delay:.06s}.cards>.card:nth-child(3){animation-delay:.12s}
.b-in,.b-out{transform-box:fill-box;transform-origin:50% 100%;animation:grow .8s cubic-bezier(.2,.8,.2,1) backwards}
.seg{animation:fade .8s ease backwards}.prog>i{transition:width .8s cubic-bezier(.2,.8,.2,1)}
.sheet{animation:pop .45s cubic-bezier(.2,.8,.2,1)}#modal{animation:fade .25s ease}
.kpi{position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--k,var(--glow2)),transparent 68%);pointer-events:none}
.grid>.kpi:nth-child(2){--k:color-mix(in srgb,var(--in) 22%,transparent)}.grid>.kpi:nth-child(3){--k:color-mix(in srgb,var(--out) 20%,transparent)}.grid>.kpi:nth-child(4){--k:color-mix(in srgb,var(--warn) 22%,transparent)}
.mark{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 16px -4px var(--glow2)}
.tabs button[aria-selected=true]{background:linear-gradient(135deg,var(--accent-soft),color-mix(in srgb,var(--accent2) 14%,var(--accent-soft)))}
.theme{display:flex;padding:3px;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.theme button{border:0;background:none;padding:6px 9px;border-radius:9px;color:var(--muted);display:grid;place-items:center;transition:background-color .3s,color .3s,transform .2s}
.theme button:hover{color:var(--fg)}.theme button:active{transform:scale(.9)}
.theme button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}::view-transition-new(root){z-index:2;animation:reveal .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes reveal{from{clip-path:circle(0 at var(--tx,100%) var(--ty,0))}to{clip-path:circle(160vmax at var(--tx,100%) var(--ty,0))}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
</style>
<script>try{var m=localStorage.getItem('pocketbook.theme');if(m&&m!=='system')document.documentElement.setAttribute('data-theme',m)}catch(e){}</script>


</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="mark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a3 3 0 0 1 3-3h11v4"/><path d="M4 7v10a3 3 0 0 0 3 3h13V8H7a3 3 0 0 1-3-1z"/><circle cx="16.5" cy="14" r="1"/></svg></span>Pocketbook</div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <div class="grow"></div>
    <div class="theme" role="group" aria-label="Theme">
      <button data-theme-set="light" aria-label="Light theme" title="Light"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button data-theme-set="system" aria-label="Match device theme" title="Match device"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
      <button data-theme-set="dark" aria-label="Dark theme" title="Dark"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div>
    <button class="btn" data-act="add">+ Add</button>
    <button class="btn primary" data-act="import">Import file</button>
    <button class="btn icon" data-act="settings" aria-label="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <div class="bar" id="bar"></div>

const loc=()=>S.cur==='INR'?'en-IN':undefined;const nfs={};

const fd=(s,y=true)=>dt(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',...(y?{year:'numeric'}:{})});

function buckets(rg,a){const to=rg.to<rg.mx?rg.to:rg.mx,from=rg.from>rg.mn?rg.from:rg.mn;const months=new Set(a.map(t=>t.d.slice(0,7)));const spanM=(dt(to).getFullYear()-dt(from).getFullYear())*12+dt(to).getMonth()-dt(from).getMonth()+1;const out=[];

/* ---------- charts ---------- */
function nice(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function spark(v,col){if(v.length<2)return'<span></span>';const w=110,h=34,mx=Math.max(...v),mn=Math.min(...v),sp=(mx-mn)||1;
  const pts=v.map((x,i)=>[2+i*(w-4)/(v.length-1),h-4-(x-mn)/sp*(h-8)]);const l=pts.map(p=>p.map(n=>n.toFixed(1)).join(',')).join(' ');const e=pts[pts.length-1];
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polygon points="2,${h} ${l} ${w-2},${h}" fill="${col}" fill-opacity=".12"/><polyline points="${l}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${e[0]}" cy="${e[1]}" r="3" fill="${col}"/></svg>`}
function cashChart(el,B){const W=Math.max(300,el.clientWidth),H=W>700?340:270,m={l:50,r:8,t:12,b:28};
  const mx=Math.max(1,...B.map(b=>Math.max(b.inc,b.sp))),mnv=Math.min(0,...B.map(b=>b.net));const ymax=nice(mx),ymin=mnv<0?-nice(-mnv):0;
  const y=v=>m.t+(H-m.t-m.b)*(1-(v-ymin)/(ymax-ymin));const band=(W-m.l-m.r)/B.length,bw=Math.min(26,band*.3);let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Income versus spending by period">`;
  for(let i=0;i<=4;i++){const v=ymin+(ymax-ymin)*i/4;s+=`<line class="grid-l" x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}"/><text x="${m.l-8}" y="${y(v)+4}" text-anchor="end">${compact(v)}</text>`}
  const step=Math.ceil(B.length/Math.max(1,Math.floor((W-m.l)/58)));let pts=[];
  B.forEach((b,i)=>{const cx=m.l+band*(i+.5);const hi=Math.max(1,y(0)-y(b.inc)),hs=Math.max(1,y(0)-y(b.sp));
    s+=`<rect class="b-in" x="${cx-bw-2}" y="${y(b.inc)}" width="${bw}" height="${hi}" rx="5"/><rect class="b-out" x="${cx+2}" y="${y(b.sp)}" width="${bw}" height="${hs}" rx="5"/>`;
    pts.push([cx,y(b.net)]);if(i%step===0)s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(b.label)}</text>`});
  s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
  pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`);
  B.forEach((b,i)=>{const tip=`<b>${esc(b.full)}</b><br>Income ${money(b.inc)}<br>Spending ${money(b.sp)}<br>Net ${money(b.net)}`;s+=`<rect x="${m.l+band*i}" y="${m.t}" width="${band}" height="${H-m.t-m.b}" fill="transparent" data-tip="${esc(tip)}"/>`});
  el.innerHTML=s+'</svg>'}
function donut(el,items,total,center){const R=72,C=2*Math.PI*R;let off=0,s=`<svg width="190" height="190" viewBox="0 0 190 190" role="img" aria-label="Breakdown"><g transform="rotate(-90 95 95)"><circle cx="95" cy="95" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="24"/>`;
  items.forEach(([n,v,c])=>{const len=v/total*C,g=items.length>1?Math.min(3,len*.2):0;s+=`<circle class="seg" data-seg="${esc(n)}" cx="95" cy="95" r="${R}" fill="none" stroke="${c}" stroke-width="24" stroke-dasharray="${Math.max(0,len-g)} ${C-len+g}" stroke-dashoffset="${-off}" data-tip="${esc(`<b>${n}</b><br>${money(v)} · ${pc(v,total)}%`)}"/>`;off+=len});
  el.innerHTML=s+`</g></svg><div class="ctr"><small>${esc(center[0])}</small><b class="num">${esc(center[1])}</b></div>`}

/* ---------- ui helpers ---------- */

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
function modal(html){const m=$('#modal');m.hidden=false;m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;const f=m.querySelector('input:not([type=hidden]),select');}
function closeModal(){$('#modal').hidden=true;$('#modal').innerHTML=''}
const sel=(id,opts,cur,extra='')=>`<select id="${id}" ${extra}>${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return`<option value="${esc(v)}" ${String(v)===String(cur)?'selected':''}>${esc(l)}</option>`}).join('')}</select>`;
const memberOpts=()=>S.demo?[['me','Me']]:S.members.map(m=>[m.id,m.name]);
const acctOpts=()=>S.accts.map(a=>[a.id,`${a.name} · ${a.type==='card'?'card':'bank'}`]);

/* ---------- views ---------- */
const TABS=[['overview','Overview'],['tx','Transactions'],['cards','Cards'],['inv','Investments'],['bud','Budgets'],['rec','Recurring'],['up','Uploads']];
function renderChrome(){
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<button role="tab" aria-selected="${S.view===k}" data-act="view" data-v="${k}">${l}</button>`).join('');
  const showR=!['bud','inv','up'].includes(S.view);
  $('#bar').innerHTML=`<div class="mem" role="group" aria-label="Family member"><button class="pill" aria-pressed="${S.member==='all'}" data-act="member" data-v="all">Everyone</button>${S.members.map(m=>`<button class="pill" aria-pressed="${S.member===m.id}" data-act="member" data-v="${m.id}"><span class="dot" style="--c:${m.color}"></span>${esc(m.name)}</button>`).join('')}</div>
  <div class="grow"></div>${showR?`<div class="pills" role="group" aria-label="Period">${RANGES().map(([k,l])=>`<button class="pill" aria-pressed="${S.range===k}" data-act="range" data-v="${k}">${esc(l)}</button>`).join('')}</div>`:''}`}
function render(){renderChrome();const v={overview,tx:txView,cards,inv,bud,rec,up:uploadsView}[S.view];$('#main').innerHTML=(S.demo?demoBanner():'')+v();after()}
function demoBanner(){return`<div class="banner"><div><b>Sample family data.</b> These are example numbers for a family of three. Import a bank or credit card statement (PDF, Excel, CSV) or a broker holdings file to replace it with yours.</div><button class="btn primary sm" data-act="import">Import my first file</button></div>`}
function after(){
  const ov=$('#cash');if(ov&&ov._B)cashChart(ov,ov._B);
  document.querySelectorAll('[data-donut]').forEach(el=>{if(el._d)donut(el,el._d.items,el._d.total,el._d.center)});
  if(S.view==='tx')renderTxRows()}
function dChip(cur,prev,invert){if(!prev||prev===0)return'';const p=(cur-prev)/Math.abs(prev)*100;if(!isFinite(p))return'';const up=p>=0;const good=invert?!up:up;
  return`<span class="chip ${Math.abs(p)<.5?'':good?'good':'bad'}">${up?'▲':'▼'} ${Math.abs(p).toFixed(0)}%</span>`}
function empty(msg){return`<div class="card empty"><p style="margin:0 0 12px"><b style="color:var(--fg)">${msg}</b></p><button class="btn primary" data-act="import">Import a file</button></div>`}

function overview(){
  const rg=getRange();if(!rg)return empty('No transactions yet. Drop a statement anywhere on this page.');
  const all=base(),cur=within(all,rg.from,rg.to),prv=rg.pf?within(all,rg.pf,rg.pt):[];const hasPrev=prv.length>0;
  const c=sums(cur),p=sums(prv),B=buckets(rg,cur);
  const days=Math.max(1,daysBetween(rg.from>rg.mn?rg.from:rg.mn,rg.to<rg.mx?rg.to:rg.mx)+1);
  const rate=c.inc>0?c.net/c.inc*100:0;const cats=byCat(cur),catTot=cats.reduce((a,x)=>a+x[1],0);
  const hv=S.hold.filter(inMember),worth=hv.reduce((a,h)=>a+h.value,0),invd=hv.reduce((a,h)=>a+h.invested,0);
  const kpi=(l,v,d,sp,col,sub)=>`<div class="card kpi s3"><div class="lbl">${l}</div><div class="val num">${v}</div><div class="foot"><span>${d||`<span class="faint">${sub||''}</span>`}</span>${sp?spark(sp,col):''}</div></div>`;
  const rtone=rate>=20?'good':rate>=5?'warn':'bad';
  const cardEl=`<div class="card s8"><h3>Money in vs out <span class="legend"><span><i style="background:var(--in)"></i>Income</span><span><i style="background:var(--out)"></i>Spending</span><span><i style="background:var(--accent)"></i>Net</span></span></h3><div id="cash"></div></div>`;
  const mems=S.members.map(m=>[m.name,sums(cur.filter(t=>t.m===m.id)).sp,m.color]).filter(x=>x[1]>0);
  const mt=mems.reduce((a,x)=>a+x[1],0);
  let h=`<div class="grid">
    ${kpi('Net cash flow',`<span class="${c.net>=0?'in':'out'}">${money(c.net)}</span>`,hasPrev?dChip(c.net,p.net,false)+' <span class="faint">vs prev.</span>':'',B.map(b=>b.net),'var(--accent)',rg.label)}
    ${kpi('Income',money(c.inc),hasPrev?dChip(c.inc,p.inc,false)+' <span class="faint">vs prev.</span>':'',B.map(b=>b.inc),'var(--in)',rg.label)}
    ${kpi('Spending',money(c.sp),hasPrev?dChip(c.sp,p.sp,true)+' <span class="faint">vs prev.</span>':'',B.map(b=>b.sp),'var(--out)',`≈ ${money(c.sp/days)} a day`)}
    ${kpi('Savings rate',`${rate.toFixed(0)}%`,`<span class="chip ${rtone}">${rate>=20?'On track':rate>=5?'Could be higher':'Overspending'}</span>`,null,null)}
    ${cardEl}
    <div class="card s4"><h3>Where it went</h3><div class="split" style="grid-template-columns:1fr"><div class="donut" data-donut></div></div>
      <div class="rows" style="margin-top:10px">${cats.slice(0,6).map(([n,v])=>`<button class="lrow" data-act="cat" data-v="${esc(n)}" data-seg="${esc(n)}"><span class="dot" style="--c:${CC[n]}"></span><span class="nm">${esc(n)}</span><span class="num">${money(v)}</span><span class="pc">${pc(v,catTot)}%</span></button>`).join('')||'<div class="muted">No spending in this period.</div>'}</div></div>
    <div class="card s4"><h3>Insights</h3><ul class="ins">${insights(cur,prv,c,p,rate,days,cats).map(i=>`<li style="--c:${i[0]}"><span>${i[1]}</span></li>`).join('')}</ul></div>
    <div class="card s4"><h3>Top merchants</h3><div class="rows">${merchants(cur).slice(0,7).map(m=>`<div class="lrow" style="grid-template-columns:auto minmax(0,1fr) auto"><span class="dot" style="--c:${CC[m.cat]}"></span><span class="nm">${esc(pretty(m.k))} <span class="faint">· ${m.n}×</span></span><span class="num">${money(m.sum)}</span></div>`).join('')||'<div class="muted">Nothing yet.</div>'}</div></div>
    <div class="card s4"><h3>Spending by weekday</h3>${weekday(cur)}</div>
    <div class="card s6"><h3>${S.member==='all'&&mems.length>1?'Family spending split':'Net worth snapshot'}</h3>${S.member==='all'&&mems.length>1?`<div class="rows">${mems.map(([n,v,col])=>`<div class="lrow" style="grid-template-columns:auto 80px minmax(0,1fr) auto"><span class="dot" style="--c:${col}"></span><span class="nm">${esc(n)}</span><div class="prog" style="--c:${col}"><i style="width:${pc(v,mt)}%"></i></div><span class="num">${money(v)}</span></div>`).join('')}</div>`:invSnap(worth,invd)}</div>
    <div class="card s6"><h3>Investments <button class="btn sm" data-act="view" data-v="inv">Open</button></h3>${invSnap(worth,invd)}</div></div>`;
  setTimeout(()=>{const e=$('#cash');if(e){e._B=B;cashChart(e,B)}const d=$('[data-donut]');if(d){const items=cats.slice(0,9).map(([n,v])=>[n,v,CC[n]]);const rest=cats.slice(9).reduce((a,x)=>a+x[1],0);if(rest>0)items.push(['Other categories',rest,'#B8C0CC']);d._d={items,total:catTot||1,center:['Total spent',compact(catTot)]};donut(d,d._d.items,d._d.total,d._d.center)}});
  return h}
function invSnap(w,i){const g=w-i;return`<div class="num" style="font-size:24px;font-weight:550">${money(w)}</div><div class="muted" style="margin:2px 0 10px">invested ${money(i)}</div><span class="chip ${g>=0?'good':'bad'}">${g>=0?'▲':'▼'} ${money(Math.abs(g))} (${i?Math.abs(g/i*100).toFixed(1):0}%)</span>`}
function weekday(a){const t=Array(7).fill(0);for(const x of a)if(!NONSPEND.has(x.cat))t[(dt(x.d).getDay()+6)%7]-=x.amt;const mx=Math.max(...t,1);const L='MTWTFSS';
  return`<div class="wk">${t.map((v,i)=>`<div class="${v===mx?'mx':''}" data-tip="${esc(['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'][i]+'<br>'+money(v))}"><i style="height:${Math.max(3,v/mx*84)}px"></i>${L[i]}</div>`).join('')}</div>`}
function insights(cur,prv,c,p,rate,days,cats){const o=[],G='var(--in)',R='var(--out)',W='var(--warn)',A='var(--accent)';
  o.push([rate>=20?G:rate>=5?W:R,rate>=0?`You kept <b>${rate.toFixed(0)}%</b> of your income (${money(c.net)}).`:`Spending is <b>${money(-c.net)}</b> more than income in this period.`]);
  if(cats[0])o.push([CC[cats[0][0]],`<b>${esc(cats[0][0])}</b> is the biggest cost: ${money(cats[0][1])}, ${pc(cats[0][1],c.sp)}% of spending.`]);
  if(prv.length){const pm=Object.fromEntries(byCat(prv));let best=null;for(const [n,v] of cats){const d=v-(pm[n]||0);if(pm[n]>0&&(!best||Math.abs(d)>Math.abs(best.d)))best={n,d,pct:d/pm[n]*100}}
    if(best&&Math.abs(best.pct)>=10)o.push([best.d>0?R:G,`<b>${esc(best.n)}</b> is ${best.d>0?'up':'down'} ${Math.abs(best.pct).toFixed(0)}% vs the previous period (${best.d>0?'+':'−'}${money(Math.abs(best.d))}).`])}
  const big=cur.filter(t=>!NONSPEND.has(t.cat)&&t.amt<0).sort((a,b)=>a.amt-b.amt)[0];if(big)o.push([A,`Largest expense: <b>${esc(pretty(mkey(big.desc)))}</b>, ${money(-big.amt)} on ${fd(big.d,false)}.`]);
  const inv=-cur.filter(t=>t.cat==='Investments').reduce((a,t)=>a+t.amt,0);if(inv>0)o.push([A,`You put <b>${money(inv)}</b> into investments (${c.inc?pc(inv,c.inc):0}% of income).`]);
  const r=recurring().filter(x=>x.sign<0);if(r.length)o.push([W,`Recurring bills and subscriptions cost about <b>${money(r.reduce((a,x)=>a+x.monthly,0))}</b> a month.`]);return o.slice(0,6)}

/* transactions */
function txView(){if(!S.tx.length)return empty('No transactions yet.');
  const accts=S.accts.filter(a=>S.tx.some(t=>t.acct===a.id));
  return`<div class="tools"><input class="in-t" id="q" type="search" placeholder="Search description or merchant" value="${esc(S.q)}" aria-label="Search">
  <select class="in-t" id="fcat" aria-label="Category" style="flex:0 1 170px"><option value="all">All categories</option>${CATS.map(([n])=>`<option ${S.fcat===n?'selected':''}>${esc(n)}</option>`).join('')}</select>
  <select class="in-t" id="facct" aria-label="Account" style="flex:0 1 190px"><option value="all">All accounts</option>${accts.map(a=>`<option value="${a.id}" ${S.facct===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>
  <select class="in-t" id="ftype" aria-label="Type" style="flex:0 1 130px">${[['all','In & out'],['out','Money out'],['in','Money in']].map(([v,l])=>`<option value="${v}" ${S.ftype===v?'selected':''}>${l}</option>`).join('')}</select>
  <button class="btn sm" data-act="copycsv">Copy CSV</button></div><div class="card" style="padding:14px 16px"><div id="txrows"></div></div>`}
function txFiltered(){const rg=getRange();const q=S.q.trim().toLowerCase();let a=within(base(),rg.from,rg.to);
  if(S.fcat!=='all')a=a.filter(t=>t.cat===S.fcat);if(S.facct!=='all')a=a.filter(t=>t.acct===S.facct);
  if(S.ftype==='out')a=a.filter(t=>t.amt<0);if(S.ftype==='in')a=a.filter(t=>t.amt>0);
  if(q)a=a.filter(t=>t.desc.toLowerCase().includes(q)||t.cat.toLowerCase().includes(q)||String(Math.abs(t.amt)).includes(q));
  const {k,dir}=S.sort;a.sort((x,y)=>k==='d'?(x.d<y.d?-1:x.d>y.d?1:0)*dir:(x.amt-y.amt)*dir);return a}
function renderTxRows(){const el=$('#txrows');if(!el)return;const a=txFiltered();const s=sums(a);const arrow=k=>S.sort.k===k?(S.sort.dir<0?' ↓':' ↑'):'';
  el.innerHTML=`<div class="tx hd"><button data-act="sort" data-v="d">Date${arrow('d')}</button><span>Description</span><span>Category</span><button data-act="sort" data-v="a" style="text-align:right">Amount${arrow('a')}</button></div>`+
  (a.slice(0,S.limit).map(t=>{const ac=acctOf(t.acct),mm=memOf(t.m);return`<div class="tx"><span class="d">${fd(t.d)}</span><span class="ds"><b title="${esc(t.desc)}">${esc(t.desc)}</b><small>${esc(ac.name)} · ${esc(mm.name)}</small></span>
    <span class="c"><select class="csel" style="--c:${CC[t.cat]||'#999'}" data-change="cat" data-id="${t.id}" aria-label="Category">${CATS.map(([n])=>`<option ${n===t.cat?'selected':''}>${esc(n)}</option>`).join('')}</select></span><span class="a num ${t.amt>0?'in':''}">${t.amt>0?'+':'−'}${money(Math.abs(t.amt),2)}</span></div>`}).join('')||'<div class="empty">No transactions match.</div>')+
  (a.length>S.limit?`<div style="text-align:center;padding-top:12px"><button class="btn sm" data-act="more">Show more (${a.length-S.limit} left)</button></div>`:'')+
  `<div class="muted" style="padding-top:12px;border-top:1px solid var(--line);margin-top:8px;font-size:13px">${a.length} transactions · in <b class="in num">${money(a.filter(t=>t.amt>0).reduce((x,t)=>x+t.amt,0))}</b> · out <b class="out num">${money(-a.filter(t=>t.amt<0).reduce((x,t)=>x+t.amt,0))}</b></div>`}

/* cards */
function cards(){const cs=S.accts.filter(a=>a.type==='card'&&(S.member==='all'||a.member===S.member));const rg=getRange();
  if(!cs.length)return`<div class="card empty"><p style="margin:0 0 12px"><b style="color:var(--fg)">No credit cards yet.</b><br>Import a credit card statement and choose “Credit card” as the account type.</p><button class="btn primary" data-act="import">Import card statement</button></div>`;
  if(!rg)return empty('No data.');
  const tot=cs.map(c=>{const a=S.tx.filter(t=>t.acct===c.id);return{c,cur:within(a,rg.from,rg.to),prv:rg.pf?within(a,rg.pf,rg.pt):[]}});
  const T=tot.reduce((a,x)=>a+sums(x.cur).sp,0),Tp=tot.reduce((a,x)=>a+sums(x.prv).sp,0);
  return`<div class="grid" style="margin-bottom:14px"><div class="card kpi s4"><div class="lbl">Card spending · ${esc(rg.label)}</div><div class="val num">${money(T)}</div><div class="foot">${rg.pf&&Tp?dChip(T,Tp,true)+' <span class="faint">vs prev.</span>':''}</div></div>
   <div class="card kpi s4"><div class="lbl">Cards</div><div class="val num">${cs.length}</div><div class="foot"><span class="faint">${cs.map(c=>esc(c.name)).join(', ')}</span></div></div></div>
   <div class="cards">${tot.map(({c,cur,prv})=>{const sp=sums(cur).sp,spp=sums(prv).sp,cats=byCat(cur).slice(0,5),mx=cats[0]?cats[0][1]:1,mm=memOf(c.member);
     const lastM=bounds()&&S.tx.filter(t=>t.acct===c.id&&t.d.slice(0,7)===bounds().mx.slice(0,7));const used=lastM?sums(lastM).sp:0;
     return`<div class="card"><h3><span style="display:flex;gap:8px;align-items:center"><span class="dot" style="--c:${mm.color}"></span>${esc(c.name)}</span><span class="tag">${esc(mm.name)}</span></h3>
     <div class="num" style="font-size:26px;font-weight:550">${money(sp)}</div><div style="margin:4px 0 0">${spp?dChip(sp,spp,true)+' <span class="faint">vs prev.</span>':''}</div>
     ${c.limit?`<div style="margin-top:12px"><div class="prog" style="--c:${used/c.limit>.7?'var(--out)':'var(--accent)'}"><i style="width:${Math.min(100,pc(used,c.limit))}%"></i></div><div class="faint" style="font-size:12px;margin-top:5px">${money(used)} this month of ${money(c.limit)} limit · ${pc(used,c.limit)}% used</div></div>`:''}
     <div class="mini">${cats.map(([n,v])=>`<div class="r"><span>${esc(n)}</span><div class="prog" style="--c:${CC[n]}"><i style="width:${v/mx*100}%"></i></div><span class="num" style="color:var(--fg)">${compact(v)}</span></div>`).join('')||'<span class="muted">No spending in this period.</span>'}</div>
     <div class="muted" style="margin-top:12px;font-size:12.5px">Top: ${merchants(cur).slice(0,3).map(m=>esc(pretty(m.k))).join(', ')||'—'}</div></div>`}).join('')}</div>`}

/* investments */
function inv(){const hs=S.hold.filter(inMember);
  if(!hs.length)return`<div class="card empty"><p style="margin:0 0 12px"><b style="color:var(--fg)">No investments tracked yet.</b><br>Import a broker or mutual fund holdings file, or add PPF, NPS, Sukanya, LIC and others by hand.</p><button class="btn primary" data-act="addhold">Add investment</button> <button class="btn" data-act="import">Import holdings</button></div>`;
  const W=hs.reduce((a,h)=>a+h.value,0),I=hs.reduce((a,h)=>a+h.invested,0),G=W-I;
  const byT=HT.map(([n,c])=>[n,hs.filter(h=>h.type===n).reduce((a,h)=>a+h.value,0),c]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  const byM=S.members.map(m=>[m.name,hs.filter(h=>h.m===m.id).reduce((a,h)=>a+h.value,0),m.color]).filter(x=>x[1]>0);
  const fy=fyStart(...(()=>{const b=bounds();const d=b?dt(b.mx):new Date();return[d.getFullYear(),d.getMonth()+1]})());
  const lim=hs.filter(h=>LIMITS[h.type]&&h.fy!=null);
  const up=hs.filter(h=>h.maturity).sort((a,b)=>a.maturity<b.maturity?-1:1).slice(0,5);
  setTimeout(()=>{const d=$('[data-donut]');if(d){d._d={items:byT,total:W||1,center:['Net worth',compact(W)]};donut(d,byT,W||1,d._d.center)}});
  return`<div class="grid">
   <div class="card kpi s3"><div class="lbl">Current value</div><div class="val num">${money(W)}</div><div class="foot"><span class="faint">${hs.length} holdings</span></div></div>
   <div class="card kpi s3"><div class="lbl">Invested</div><div class="val num">${money(I)}</div><div class="foot"><span class="faint">across ${byT.length} asset types</span></div></div>
   <div class="card kpi s3"><div class="lbl">Gain / loss</div><div class="val num ${G>=0?'in':'out'}">${G>=0?'+':'−'}${money(Math.abs(G))}</div><div class="foot"><span class="chip ${G>=0?'good':'bad'}">${I?(G/I*100).toFixed(1):0}% overall</span></div></div>
   <div class="card kpi s3"><div class="lbl">Largest asset</div><div class="val" style="font-size:21px;font-weight:600">${byT[0]?esc(byT[0][0]):'—'}</div><div class="foot"><span class="faint">${byT[0]?pc(byT[0][1],W)+'% of portfolio':''}</span></div></div>
   <div class="card s5"><h3>Allocation</h3><div class="split"><div class="donut" data-donut></div><div class="rows">${byT.map(([n,v,c])=>`<div class="lrow" data-seg="${esc(n)}" style="grid-template-columns:auto minmax(0,1fr) auto auto"><span class="dot" style="--c:${c}"></span><span class="nm">${esc(n)}</span><span class="num">${compact(v)}</span><span class="pc">${pc(v,W)}%</span></div>`).join('')}</div></div></div>

 bkcopy(){const j=JSON.stringify({uploads:S.uploads,tx:S.tx,hold:S.hold,members:S.members,accts:S.accts,rules:S.rules,budgets:S.budgets,cur:S.cur});(navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>toast('Backup copied'),()=>{$('#bkarea').innerHTML=`<textarea class="in-t" style="width:100%;margin-top:10px" rows="5" readonly>${esc(j)}</textarea>`})},
 bkshow(){$('#bkarea').innerHTML='<div class="fld" style="margin-top:10px"><input type="file" id="bkfile" accept=".json" style="margin-bottom:8px"><textarea id="bktxt" rows="5" placeholder="Choose a backup file, or paste it here"></textarea></div><button class="btn sm primary" data-act="bkgo" style="margin-top:8px">Restore</button>'},
 bkgo(){try{const j=JSON.parse($('#bktxt').value);Object.assign(S,{tx:j.tx||[],hold:j.hold||[],uploads:j.uploads||[],members:j.members,accts:j.accts||[],rules:j.rules||{},budgets:j.budgets||{},cur:j.cur||'INR',demo:false});S.member='all';save();closeModal();render();toast('Backup restored')}catch(e){toast('That backup could not be read')}},
 clear(e){if(e.dataset.sure){try{localStorage.removeItem(KEY)}catch(x){}S.demo=false;S.tx=[];S.hold=[];S.uploads=[];S.accts=[];S.budgets={};S.rules={};S.member='all';S.members=[{id:uid(),name:'Me',color:MCOL[0]}];save();closeModal();render();toast('All data deleted')}else{e.dataset.sure=1;e.textContent='Click again to delete everything'}}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t&&A[t.dataset.act]){A[t.dataset.act](t,e)}else if(e.target.id==='modal'&&!$('[data-act=pwok]'))closeModal()});
const C={
 cat(el){const t=S.tx.find(x=>x.id===el.dataset.id);t.cat=el.value;const k=mkey(t.desc);S.rules[k]=el.value;let n=0;for(const x of S.tx)if(x!==t&&mkey(x.desc)===k&&x.cat!==el.value){x.cat=el.value;n++}save();renderTxRows();toast(n?`Moved ${n+1} “${pretty(k)}” transactions to ${el.value}`:'Category updated')},
 bud(el){const v=+el.value;if(v>0)S.budgets[el.dataset.v]=v;else delete S.budgets[el.dataset.v];save();render()},
 cur(el){S.cur=el.value;for(const k in nfs)delete nfs[k];save();settings();render()},
 mname(el){const m=S.members.find(x=>x.id===el.dataset.id);m.name=el.value.trim()||m.name;save();render()},
 aname(el){const a=S.accts.find(x=>x.id===el.dataset.id);a.name=el.value.trim()||a.name;save();render()},
 atype(el){S.accts.find(x=>x.id===el.dataset.id).type=el.value;save();render()},
 amem(el){const a=S.accts.find(x=>x.id===el.dataset.id);a.member=el.value;S.tx.forEach(t=>{if(t.acct===a.id)t.m=el.value});save();render()},
 alim(el){S.accts.find(x=>x.id===el.dataset.id).limit=+el.value||undefined;save();render()},
 htype(el){const f=$('#hfy');if(!f.value&&LIMITS[el.value])f.placeholder='Up to '+money(LIMITS[el.value])},
 iacct(el){S.imp.acct=el.value==='new'?null:el.value;if(el.value==='new'&&!S.imp.nm)S.imp.nm='';readImp();txDialog()},
 impmap(){readImp();txDialog()}
};
function readImp(){const i=S.imp;if(!i||i.kind!=='tx')return;const g=id=>$('#'+id)?+$('#'+id).value:null;const v=(id,k)=>{const x=g(id);if(x!==null)i.map[k]=x};
  v('mdate','date');v('mdesc','desc');v('mamt','amt');v('mdeb','debit');v('mcre','credit');if($('#iorder'))i.order=$('#iorder').value;if($('#iflip'))i.flip=$('#iflip').checked;
  if($('#inm'))i.nm=$('#inm').value;if($('#ity'))i.acctType=$('#ity').value;if($('#imem'))i.mem=$('#imem').value;if($('#iacct')&&$('#iacct').value!=='new')i.acct=$('#iacct').value;else if($('#iacct'))i.acct=null}
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.change&&C[t.dataset.change]){C[t.dataset.change](t)}
  else if(t.id==='fcat'){S.fcat=t.value;S.limit=80;renderTxRows()}else if(t.id==='facct'){S.facct=t.value;S.limit=80;renderTxRows()}else if(t.id==='ftype'){S.ftype=t.value;S.limit=80;renderTxRows()}
  else if(t.id==='bkfile'){t.files[0]&&t.files[0].text().then(x=>{$('#bktxt').value=x})}
  else if(t.id==='file'){const f=[...t.files];t.value='';takeFiles(f)}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S.limit=80;renderTxRows()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden&&!$('[data-act=pwok]'))closeModal();if(e.key==='Enter'&&e.target.id==='pw')A.pwok()});
/* tooltips + chart highlight */
const tip=$('#tip');
function tipMove(e){const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){tip.style.opacity=0;return}tip.innerHTML=t.getAttribute('data-tip');tip.style.opacity=1;
  const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;tip.style.left=Math.max(8,x)+'px';tip.style.top=Math.max(8,y)+'px'}
document.addEventListener('pointermove',tipMove);document.addEventListener('pointerdown',tipMove);document.addEventListener('pointerleave',()=>tip.style.opacity=0);
document.addEventListener('pointerover',e=>{const s=e.target.closest&&e.target.closest('[data-seg]');const d=$('[data-donut]');if(!d||!d._d)return;
  d.querySelectorAll('.seg').forEach(c=>c.style.opacity=s&&c.dataset.seg!==s.dataset.seg?.25:1);document.querySelectorAll('.lrow[data-seg]').forEach(r=>r.classList.toggle('hi',!!s&&r.dataset.seg===s.dataset.seg));
  const c=d.querySelector('.ctr');if(c){const it=s&&d._d.items.find(x=>x[0]===s.dataset.seg);c.innerHTML=it?`<small>${esc(it[0])}</small><b class="num">${compact(it[1])}</b>`:`<small>${esc(d._d.center[0])}</small><b class="num">${esc(d._d.center[1])}</b>`}});
/* drag and drop */
let dc=0;const dz=$('#drop');
addEventListener('dragenter',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){dc++;dz.hidden=false}});
addEventListener('dragleave',()=>{dc=Math.max(0,dc-1);if(!dc)dz.hidden=true});addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dc=0;dz.hidden=true;if(e.dataTransfer.files.length)takeFiles([...e.dataTransfer.files])});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const e=$('#cash');if(e&&e._B)cashChart(e,e._B)},120)});


/* theme */
const TK='pocketbook.theme';let themeMode='system';try{themeMode=localStorage.getItem(TK)||'system'}catch(e){}
function paintTheme(){const r=document.documentElement;themeMode==='system'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',themeMode);document.querySelectorAll('[data-theme-set]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themeSet===themeMode)))}
function setTheme(mode,btn){if(mode===themeMode)return;const go=()=>{themeMode=mode;try{localStorage.setItem(TK,mode)}catch(e){}paintTheme()};
  if(document.startViewTransition&&!matchMedia('(prefers-reduced-motion:reduce)').matches){const b=btn.getBoundingClientRect(),st=document.documentElement.style;st.setProperty('--tx',(b.left+b.width/2)+'px');st.setProperty('--ty',(b.top+b.height/2)+'px');document.startViewTransition(go)}else go()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-theme-set]');if(b)setTheme(b.dataset.themeSet,b)});
paintTheme();
load();render();
})();
</script>
