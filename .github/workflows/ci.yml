name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the secret scan needs history to diff a PR against its base
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: JavaScript syntax
        run: npm run check

      - name: Versions agree and changelog is current
        run: |
          V=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' version.json)
          P=$(sed -n 's/^  "version": *"\([^"]*\)".*/\1/p' package.json)
          J=$(sed -n "s/^const VERSION='\([^']*\)'.*/\1/p" js/app.js)
          echo "version.json=$V package.json=$P app.js=$J"
          [ "$V" = "$P" ] && [ "$V" = "$J" ] || { echo "::error::Versions differ. Use deploy/bump.sh"; exit 1; }
          grep -q "^## \[$V\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $V"; exit 1; }

      - name: PHP updater syntax
        run: php -l deploy/update.php && php -l deploy/update.config.example.php

      - name: Vendored libraries are unmodified
        run: cd vendor && sha256sum -c SHA256SUMS

      - name: No third-party URLs or unsafe patterns in the app
        run: |
          if grep -nE "https?://" index.html css/app.css js/app.js js/theme.js js/statement.js | grep -vE "w3.org|flaticon.com|github.com" ; then
            echo "::error::External URL found; the app must make no third-party requests"; exit 1
          fi
          if grep -nE "\beval\(|new Function\(|document\.write\(|\son(click|error|load|input|change)=[\"']" index.html js/app.js js/theme.js js/statement.js; then
            echo "::error::Unsafe pattern found"; exit 1
          fi

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm test
