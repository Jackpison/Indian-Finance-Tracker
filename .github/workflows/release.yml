name: Release

# Publish a release by pushing a version tag:
#   deploy/bump.sh 1.1.0   # sets the version, then edit CHANGELOG.md and commit
#   git tag v1.1.0 && git push origin main --tags
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)deploy, e.g. v0.0.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check version consistency
        id: ver
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          V=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' version.json)
          P=$(sed -n 's/^  "version": *"\([^"]*\)".*/\1/p' package.json)
          J=$(sed -n "s/^const VERSION='\([^']*\)'.*/\1/p" js/app.js)
          echo "tag=$TAG version.json=$V package.json=$P app.js=$J"
          [ "$TAG" = "v$V" ] && [ "$V" = "$P" ] && [ "$V" = "$J" ] || { echo "::error::Tag and versions do not match. Run deploy/bump.sh and re-tag."; exit 1; }
          grep -q "^## \[$V\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: cd vendor && sha256sum -c SHA256SUMS
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - name: Build ZIP
        run: ./deploy/make-zip.sh "portfolio-v${{ steps.ver.outputs.version }}.zip"

      - name: Write release notes (changelog + install + checksum)
        run: |
          V="${{ steps.ver.outputs.version }}"
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > changes.md
          test -s changes.md || { echo "::error::Release notes are empty"; exit 1; }
          PREV=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "v$V" | head -1 || true)
          {
            echo "## What's new in v$V"
            echo
            cat changes.md
            echo
            echo "## Install or update"
            echo
            echo "- **cPanel / any host:** download \`portfolio-v$V.zip\` below, upload it to your site folder and extract over the old files. Your data lives in the browser and is not touched."
            echo "- **Automatic:** FTPS deploys and the one-click \`update.php\` are described in the [README](https://github.com/${{ github.repository }}#releases-and-updates)."
            echo
            echo "## Verify the download"
            echo
            echo "\`sha256: $(cut -d' ' -f1 "portfolio-v$V.zip.sha256")\`"
            if [ -n "$PREV" ]; then echo; echo "**Full changelog:** https://github.com/${{ github.repository }}/compare/$PREV...v$V"; fi
          } > notes.md
          cat notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          FILES="portfolio-$TAG.zip portfolio-$TAG.zip.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --title "Portfolio $TAG" --notes-file notes.md --latest
          else
            gh release create "$TAG" $FILES --title "Portfolio $TAG" --notes-file notes.md --latest --verify-tag
          fi

      - name: Stage site for hosting
        run: |
          mkdir site && unzip -q "portfolio-v${{ steps.ver.outputs.version }}.zip" -d site
          ls -A site

      - name: Deploy to hosting over FTPS (optional)
        if: ${{ vars.DEPLOY_FTP == 'true' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          server-dir: ${{ vars.FTP_DIR || './' }}
          # index.html is uploaded last by the action's diffing; version.json changes with every release,
          # which is how open browser tabs learn there is an update.
