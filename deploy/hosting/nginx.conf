server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  # Refuse bots, scrapers and scripted clients. robots.txt is matched first and stays readable so polite crawlers can see the ban.
  set $blocked 0;
  if ($http_user_agent = "") { set $blocked 1; }
  if ($http_user_agent ~* "(bot|crawl|spider|scrap|slurp|curl|wget|python|java/|libwww|go-http|okhttp|httpclient|headless|phantom|selenium|puppeteer|playwright|gptbot|ccbot|claude|anthropic|perplexity|bytespider|amazonbot|semrush|ahrefs|mj12|dotbot|petalbot|yandex|baidu|facebookexternalhit|bingpreview|archive\.org)") { set $blocked 1; }
  location = /robots.txt { add_header Cache-Control "no-cache" always; }
  location / { if ($blocked) { return 403; } try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache" always; }
  location /vendor/ { if ($blocked) { return 403; } add_header Cache-Control "public, max-age=31536000, immutable" always; }
}
